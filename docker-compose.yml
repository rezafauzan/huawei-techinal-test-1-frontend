services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DEBUG: "true"
      PORT: 8888
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8888:8888"

  frontend:
    build:
      context: .
    environment:
      VITE_API_BASE_URL: http://localhost:8888
    ports:
      - "3000:3000"
    depends_on:
      - backend
